spring.application.name=personal-ai-agent-platform
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
spring.mvc.problemdetails.enabled=true
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
sai.mode=${SAI_MODE:demo}
sai.data-dir=${SAI_DATA_DIR:}
sai.repository-root=${SAI_REPOSITORY_ROOT:}
sai.storage.max-upload-bytes=${SAI_MAX_UPLOAD_BYTES:10485760}
sai.database.url=${SAI_DB_URL:}
sai.database.username=${SAI_DB_USER:}
sai.database.password-file=${SAI_DB_PASSWORD_FILE:}
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.springframework.transaction=INFO
logging.level.org.postgresql=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.flywaydb=INFO
