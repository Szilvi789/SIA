name: Public source privacy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install checksum-verified Gitleaks 8.30.1
        run: node scripts/install-privacy-tools.mjs
      - name: Test Git privacy safeguards
        run: node --test scripts/privacy-audit.test.mjs
      - name: Audit tracked files, index, working tree, and history
        run: node scripts/privacy-audit.mjs
